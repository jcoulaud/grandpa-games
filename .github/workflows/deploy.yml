# Checks types and game rules on each pull request and on main. When main passes, it publishes
# https://jeux-papi.fr. The deploy uses the CLOUDFLARE_API_TOKEN repository secret, an account token named
# "grandpa-games GitHub deploy" (Workers and D1 on the account, and routes, DNS and certificates on
# jeux-papi.fr only). Without the secret, the deploy does nothing.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" in the Actions tab tests and deploys main again
permissions:
  contents: read
# One run per branch or pull request at a time. On main, a run waits for the one before it, so an older
# commit never deploys after a newer one. Elsewhere, a new push stops the run of the previous one.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:rules
      - name: Deploy the latest main commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare deploy token. Skipping deploy."
            exit 0
          fi
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Skipping deploy."
            exit 0
          fi
          bun run deploy
