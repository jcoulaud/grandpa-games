# Publishes https://jeux-papi.fr when main changes. It uses the CLOUDFLARE_API_TOKEN repository secret,
# an account token named "grandpa-games GitHub deploy" (Workers and D1 on the account, and routes, DNS and
# certificates on jeux-papi.fr only). Without the secret, the job does nothing.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" in the Actions tab deploys main again
concurrency: deploy
jobs:
  deploy:
    # A manual run can name any branch: only main ever reaches the live site and its database.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun run typecheck
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: bun run deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
