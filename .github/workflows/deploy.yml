# Runs the tests on each pull request and on main. When main changes and the tests pass, it publishes
# https://jeux-papi.fr. The deploy uses the CLOUDFLARE_API_TOKEN repository secret, an account token named
# "grandpa-games GitHub deploy" (Workers and D1 on the account, and routes, DNS and certificates on
# jeux-papi.fr only). Without the secret, the deploy does nothing.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" in the Actions tab tests and deploys main again
# One run of main at a time, from the tests to the deploy, so an older commit never deploys after a newer one.
# A new push to a pull request stops the run of the previous one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: tests/screenshots
  deploy:
    # A manual run can name any branch: only main ever reaches the live site and its database.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Only the commit at the head of main deploys: an older run that finishes last does not roll the site back.
      - id: head
        run: echo "sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.head.outputs.sha == github.sha
      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.head.outputs.sha == github.sha
      - run: bun install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.head.outputs.sha == github.sha
      - run: bun run deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.head.outputs.sha == github.sha
