<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Jeux de Papi",
  "url": "https://jeux-papi.fr/",
  "description": "Des jeux simples pour les grands-parents : cartes, lettres, chiffres et réflexion, en grand et tout en français.",
  "inLanguage": "fr",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Windows, macOS, Linux, Android, iOS",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },

<style>
  :root {
    --gold: #FFC83D; --accent: #0B6B5D; --text: #1B2422; --muted: #4E5A57;
    --face: #FFFDF6; --red: #C4122F; --ink: #14171A; --back: #1F4470;
    --ui: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(60% 50% at 0% 100%, rgb(255 200 61 / .16), transparent 70%) fixed,
      radial-gradient(ellipse at 50% 35%, transparent 50%, rgb(0 0 0 / 28%) 100%) fixed,
      radial-gradient(120% 90% at 50% 0%, #1A6A5F, #0F4F47 70%) #0F4F47 fixed;
    color: #fff; font-family: var(--ui); -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1320px; margin: 0 auto; padding: 18px 40px 16px; display: flex; flex-direction: column; gap: 18px; width: 100%; }

  /* Large suit outlines behind the page */
  #deco { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #deco svg { position: absolute; fill: none; stroke: rgb(255 255 255 / .13); stroke-width: 1.4; }
  @media (max-width: 700px) { #deco { display: none; } }

  /* Greeting */
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 6px; }
  h1 { margin: 0; font: 700 50px/1.05 var(--ui); letter-spacing: -.02em; }
  #tagline { margin: 6px 0 0; font: 500 25px var(--ui); color: rgba(255,255,255,.78); }
  #now { text-align: right; }
  #time { font: 600 46px/1 var(--ui); letter-spacing: -.01em; color: rgba(255,255,255,.92); font-variant-numeric: tabular-nums; }
  #date { margin-top: 6px; font: 500 25px var(--ui); color: rgba(255,255,255,.78); }

  /* A note from the family */
  #note {
    display: none; align-items: center; gap: 20px; padding: 16px 26px; border-radius: 22px;
    background: var(--face); color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  #note.on { display: flex; }
  #note .icon { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #FCEDE9; display: grid; place-items: center; }
  #note .icon svg { width: 32px; height: 32px; fill: var(--red); }
  #note small { display: block; font: 700 20px var(--ui); color: var(--accent); letter-spacing: .02em; margin-bottom: 4px; }
  #note p { margin: 0; font: 600 27px/1.3 var(--ui); }


  /* Game tiles */
  /* Three games per row at most, so each tile has room for its words. A tile is at least 300 px wide. */
  #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(300px, calc((100% - 44px) / 3)), 1fr)); gap: 22px; }
  .tile {
    position: relative; display: flex; flex-direction: column; border-radius: 28px; overflow: hidden;
    background: var(--face); color: var(--text); text-decoration: none;
    box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 14px 34px rgba(0,0,0,.28);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  a.tile:hover { transform: translateY(-4px); box-shadow: 0 4px 8px rgba(0,0,0,.2), 0 22px 44px rgba(0,0,0,.32); }
  a.tile:focus-visible { outline: 5px solid var(--gold); outline-offset: 4px; }
  .art {
    height: 150px; position: relative; overflow: hidden;
    background: radial-gradient(90% 120% at 50% 0%, #1F7A6C, #12594F);
  }
  .art svg.board { position: absolute; left: 50%; bottom: -30px; width: 224px; height: 140px; margin-left: -112px;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); transform: rotate(-5deg); }
  /* The card games lay the cards of the games (lib/cards.css) on a 260 by 150 scene, centred:
     what a tile crops on the sides is only felt. */
  .art .scene { position: absolute; left: 50%; top: 0; width: 260px; height: 150px; margin-left: -130px; }
  .art .card { transition: none; }
  .art .card.lifted { box-shadow: 0 12px 22px rgba(0,0,0,.45); }
  .art .slot { position: absolute; border-radius: 6px; background: rgb(0 0 0 / .14); border: 2px dashed rgb(255 255 255 / .45); }
  .body { padding: 12px 22px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h3 { margin: 0; font: 700 31px var(--ui); letter-spacing: -.01em; }
  .body p { margin: 0; font: 500 20px/1.35 var(--ui); color: var(--muted); }
  .status { display: flex; align-items: center; gap: 9px; min-height: 30px; font: 600 21px var(--ui); color: var(--accent); }
  .status svg { width: 26px; height: 26px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .status:empty { display: none; }
  .play {
    margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; padding: 8px 16px; text-align: center;
    border-radius: 16px; background: var(--gold); color: #1F1A00; font: 700 22px var(--ui);
  }
  a.tile:hover .play { background: #FFD666; }
  .play svg { width: 26px; height: 26px; fill: currentColor; }
  a.tile.opening { opacity: .85; transform: none; }

  /* Footer band: where the saves are on the left, the install button on the right */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; }
  footer { background: rgba(0,0,0,.18); border-top: 1px solid rgba(255,255,255,.08); }
  footer .in { max-width: 1320px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px;
    font: 500 20px var(--ui); color: rgba(255,255,255,.85); }
  #saves { display: flex; align-items: center; gap: 10px; }
  #saves svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #install { display: none; flex: none; min-height: 54px; padding: 8px 22px; border: 0; border-radius: 15px; cursor: pointer;
    background: #fff; color: var(--text); font: 600 21px var(--ui); }
  #install.on { display: inline-flex; align-items: center; }
  #installed { display: none; margin: 0; max-width: 520px; text-align: right; }
  #installed.on { display: block; }

  @media (max-width: 700px) {
    main { padding: 24px 16px; }
    footer .in { padding: 14px 16px; flex-wrap: wrap; }
    h1 { font-size: 42px; } #time { display: none; }
    header { flex-wrap: wrap; row-gap: 0; } #now { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } a.tile:hover { transform: none; } }
</style>

<body>

<div id="deco" aria-hidden="true">
  <svg viewBox="-5 -5 110 110" style="width:520px;left:-150px;bottom:-140px;transform:rotate(-16deg)"><path d="M50 5C62 26 95 40 95 61c0 12-10 20-21 20-8 0-15-4-19-11 1 11 6 20 13 26H32c7-6 12-15 13-26-4 7-11 11-19 11C15 81 5 73 5 61 5 40 38 26 50 5z"/></svg>
  <svg viewBox="-5 -5 110 110" style="width:380px;right:-90px;bottom:-60px;transform:rotate(14deg)"><path d="M50 92C22 66 5 50 5 31 5 17 16 7 29 7c9 0 17 5 21 14 4-9 12-14 21-14 13 0 24 10 24 24 0 19-17 35-45 61z"/></svg>
  <svg viewBox="-5 -5 110 110" style="width:200px;right:22%;bottom:10%;transform:rotate(8deg)"><path d="M50 2Q69 29 91 50Q69 71 50 98Q31 71 9 50Q31 29 50 2z"/></svg>
  <svg viewBox="-5 -5 110 110" style="width:220px;right:-110px;top:46%;transform:rotate(-10deg)"><path d="M32.9 38.2A21 21 0 1 1 67.1 38.2A21 21 0 1 1 55.8 68.5C57 82 61 90 67 96H33C39 90 43 82 44.2 68.5A21 21 0 1 1 32.9 38.2z"/></svg>
</div>

<main>
  <header>
    <div>
      <h1 id="hello">Bonjour Papi !</h1>
      <p id="tagline">Des jeux simples, gratuits et sans publicité.</p>
    </div>
    <div id="now">
      <div id="time"></div>
      <div id="date"></div>
    </div>
  </header>

  <section id="note" aria-live="polite">
    <div class="icon"><svg viewBox="0 0 100 100"><use href="#su1"/></svg></div>
    <div><small id="noteFrom"></small><p id="noteText"></p></div>
  </section>

  <section id="games" aria-label="Vos jeux"></section>

</main>
<footer><div class="in">
  <div id="saves"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Vos parties sont gardées sur cet ordinateur.</div>
  <button id="install">Installer sur cet ordinateur</button>
  <p id="installed">Le jeu est déjà installé. Pour l’ouvrir, cliquez sur la petite icône en haut, à droite de la barre d’adresse.</p>
</div></footer>

<script src="lib/store.js"></script>
<script src="lib/cards.js"></script>
<script>
'use strict';
// The library. To add a game: put it in <id>/index.html, add it here, and add its folder to CORE in sw.js.
// Each game has its own look: the felt of its table, and a scene drawn in its own way (see the scenes below).
// The dames show a corner of the board with its pieces.
const GAMES = [
  { id: 'solitaire', title: 'Solitaire', text: 'Rangez toutes les cartes, de l’as jusqu’au roi.',
    felt: ['#1F7A6C', '#12594F'], scene: solitaireScene },
  { id: 'freecell', title: 'FreeCell', text: 'Rangez les cartes avec l’aide de quatre cases libres.',
    felt: ['#2E66A0', '#173F6B'], scene: freecellScene },
  { id: 'dames', title: 'Dames', text: 'Le jeu de dames sur 100 cases, contre l’ordinateur.',
    felt: ['#8A3440', '#4C161E'], scene: boardArt },
  { id: 'dame-de-pique', title: 'Dame de pique', text: 'Évitez les cœurs et la dame de pique, à quatre.',
    felt: ['#6A4488', '#2C1840'], scene: piqueScene },
];

// A card as the games draw it, centred on (x, y), w wide, turned by rot degrees.
// A card id is suit * 13 + rank - 1, with the suits pique, cœur, carreau, trèfle (see lib/cards.js).
const PIQUE = 0, COEUR = 13, CARREAU = 26, TREFLE = 39;
function card(id, x, y, w, rot = 0, cls = '') {
  const h = w * 1.3, down = cls.includes('down');
  return `<div class="card ${Cards.rd(id) ? 'red' : 'black'} ${cls}" style="--w: ${w}px; --h: ${h}px; left: ${x - w / 2}px; top: ${y - h / 2}px; transform: rotate(${rot}deg)">${down ? '' : Cards.faceHtml(id)}</div>`;
}
const back = (x, y, w, rot) => card(0, x, y, w, rot, 'down');
// An empty place for a card: a dashed outline on the felt.
const slot = (x, y, w) => `<div class="slot" style="left: ${x - w / 2}px; top: ${y - w * .65}px; width: ${w}px; height: ${w * 1.3}px"></div>`;
const scene = inner => `<div class="scene" aria-hidden="true">${inner}</div>`;

// Solitaire: the stock face down, a column going down from the roi in alternating colours,
// and the as de cœur on its foundation.
function solitaireScene() {
  return scene(
    back(48, 76, 58, -4) + back(50, 74, 58, -1) + back(52, 72, 58, 2)
    + card(PIQUE + 12, 130, 42, 58) + card(COEUR + 11, 130, 63, 58) + card(TREFLE + 10, 130, 84, 58) + card(CARREAU + 9, 130, 105, 58)
    + slot(212, 76, 58) + card(COEUR, 212, 74, 58, 5));
}
// FreeCell: the four free cells. One holds a card, two are free, and a roi drops into the last one.
function freecellScene() {
  return scene(
    slot(43, 80, 54) + slot(101, 80, 54) + slot(159, 80, 54) + slot(217, 80, 54)
    + card(TREFLE + 6, 43, 80, 54)
    + card(COEUR + 12, 222, 62, 58, 9, 'lifted'));
}
// Dame de pique: a trick on the table, one card from each of the four players, and the dame de pique on top.
function piqueScene() {
  return scene(
    card(TREFLE + 2, 130, 46, 58, 172) + card(COEUR + 8, 80, 78, 58, -78) + card(COEUR + 10, 180, 74, 58, 84)
    + card(PIQUE + 11, 132, 94, 68, -7, 'lifted'));
}

// A corner of the dames board: 6 by 4 squares, a few pieces and a crowned one.
function boardArt() {
  let sq = '<rect width="240" height="160" fill="#EEDCB6"/>';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) if ((r + c) % 2) sq += `<rect x="${c * 40}" y="${r * 40}" width="40" height="40" fill="#8F5B39"/>`;
  // As on the game's board: a disc with its edge below, two grooves, and a crown on a king.
  const piece = (c, r, white, king) => `<g transform="translate(${c * 40 + 20} ${r * 40 + 18})">
    <circle cy="2.5" r="16" fill="${white ? '#C8BB9C' : '#0E0D0C'}"/>
    <circle r="16" fill="${white ? '#F8F2E4' : '#2C2826'}" stroke="${white ? '#9C8C6C' : '#5B544E'}" stroke-width="1"/>
    <circle r="12" fill="none" stroke="${white ? '#C9BFA8' : '#141211'}" stroke-width="1.2"/>
    <circle r="7.5" fill="none" stroke="${white ? '#C9BFA8' : '#141211'}" stroke-width="1.2"/>
    ${king ? '<path d="M-9 -4l4.2 3.6L0 -9l4.3 7.1 4.2-3.6-1.8 10H-7.2z" fill="#E2A82C" stroke="#5E3F06" stroke-width="1"/>' : ''}</g>`;
  sq += piece(1, 0, false) + piece(3, 0, false) + piece(4, 1, false) + piece(2, 1, true, true) + piece(1, 2, true) + piece(3, 2, true) + piece(0, 3, true);
  return `<svg class="board" viewBox="0 0 240 150" aria-hidden="true"><rect x="-6" y="-6" width="252" height="172" rx="4" fill="#6A4127"/>${sq}</svg>`;
}
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_TROPHY = '<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8.5 20h7"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const tiles = GAMES.map(g => {
    const meta = GG.meta(g.id);
    const parts = meta && meta.summary ? meta.summary.split(' · ') : [];
    const playing = parts.some(p => /en cours/i.test(p));
    // The button already says a game is in progress: the line under the text shows only the wins.
    const wins = parts.filter(p => !/en cours/i.test(p)).join(' · ');
    return `<a class="tile" href="${g.id}/" data-id="${g.id}">
      <div class="art" style="background: radial-gradient(90% 120% at 50% 0%, ${g.felt[0]}, ${g.felt[1]})">${g.scene()}</div>
      <div class="body">
        <h3>${esc(g.title)}</h3>
        <p>${esc(g.text)}</p>
        <div class="status">${wins ? ICON_TROPHY + esc(wins) : ''}</div>
        <div class="play">${ICON_PLAY}${playing ? 'Reprendre la partie' : 'Jouer'}</div>
      </div></a>`;
  });
  document.getElementById('games').innerHTML = tiles.join('');
}
document.getElementById('games').addEventListener('click', e => {
  const t = e.target.closest('a.tile');
  // A click with Cmd, Ctrl or Shift opens the game in another tab or window: this page stays.
  if (!t || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  t.classList.add('opening');
  t.querySelector('.play').textContent = 'Un instant…';
  // If the browser stops the navigation, the tiles must not stay on "Un instant…".
  setTimeout(render, 4000);
});
// Safari keeps the page in memory when Papi goes into a game. Coming back, redraw the tiles.
addEventListener('pageshow', e => { if (e.persisted) render(); });

function clock() {
  const d = new Date(), h = d.getHours();
  const hello = h < 5 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 14 ? 'Bon appétit' : h < 18 ? 'Bon après-midi' : h < 22 ? 'Bonsoir' : 'Bonne nuit';
  document.getElementById('hello').textContent = hello + ' Papi !';
  const date = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('date').textContent = date.charAt(0).toUpperCase() + date.slice(1);
  document.getElementById('time').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// The note lives in message.json. An empty text hides it.
async function note() {
  try {
    const m = await (await fetch('message.json', { cache: 'no-cache' })).json();
    if (!m.text) return;
    document.getElementById('noteFrom').textContent = m.from ? `Un mot de ${m.from}` : 'Un petit mot';
    document.getElementById('noteText').textContent = m.text;
    document.getElementById('note').classList.add('on');
  } catch (e) {}
}

// Chrome and Edge offer to install the site as an app. Show the offer as a plain button.
let installEvent = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvent = e;
  document.getElementById('install').classList.add('on');
});
document.getElementById('install').onclick = async () => {
  if (!installEvent) return;
  installEvent.prompt();
  await installEvent.userChoice;
  installEvent = null;
  document.getElementById('install').classList.remove('on');
};

// Deleting the desktop icon leaves the app installed, so the browser offers no install.
// Say where to open it instead. The manifest lists the app in related_applications for this check.
if (!matchMedia('(display-mode: standalone)').matches && navigator.getInstalledRelatedApps) {
  navigator.getInstalledRelatedApps().then(apps => {
    if (apps.length && !installEvent) document.getElementById('installed').classList.add('on');
  }).catch(() => {});
}

clock(); setInterval(clock, 15000);
render(); note();
</script>
</body>
</html>
