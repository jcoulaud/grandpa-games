<!doctype html>
<!-- The link preview image, 1200 x 630. scripts/icons.mjs renders it to public/og.jpg. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60% 60% at 0% 100%, rgb(255 200 61 / .18), transparent 70%),
      radial-gradient(ellipse at 50% 35%, transparent 50%, rgb(0 0 0 / 28%) 100%),
      radial-gradient(120% 90% at 50% 0%, #1A6A5F, #0F4F47 70%) #0F4F47;
  }
  .text { position: absolute; left: 90px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; font: 800 76px/1.06 Inter; letter-spacing: -.03em; }
  h1 em { white-space: nowrap; font-style: normal; color: #FFC83D; }
  p { margin: 30px 0 0; font: 600 42px Inter; color: rgb(255 255 255 / .88); }
  .brand { position: absolute; left: 90px; bottom: 56px; display: flex; align-items: center; gap: 14px; font: 700 34px Inter; color: rgb(255 255 255 / .75); }
  .games { position: absolute; right: 50px; top: 55px; width: 470px; height: 520px; }
  .games > * { position: absolute; }
  .shadow { box-shadow: 0 3px 6px rgb(0 0 0 / .18), 0 22px 44px rgb(0 0 0 / .32); }

  .card { left: 110px; top: 40px; width: 236px; height: 330px; border-radius: 22px; transform: rotate(-7deg);
    background: linear-gradient(160deg, #FFFFFF, #F6F1E4); color: #C4122F; fill: #C4122F; }
  .card::after { content: ""; position: absolute; inset: 10px; border-radius: 14px; border: 1.5px solid rgb(196 18 47 / .18); }
  .corner { position: absolute; left: 22px; top: 18px; font: 800 38px/1 Inter; text-align: center; }
  .corner svg { display: block; width: 26px; height: 26px; margin: 5px auto 0; }
  .corner.low { left: auto; top: auto; right: 22px; bottom: 18px; transform: rotate(180deg); }
  .card > svg { position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -56px 0 0 -56px; }

  .tile { left: 340px; top: 0; width: 104px; height: 104px; border-radius: 16px; transform: rotate(9deg);
    background: linear-gradient(150deg, #FFD966, #F2B42A); color: #3A2A00; display: grid; place-items: center; font: 800 62px Inter;
    box-shadow: inset 0 2px 0 rgb(255 255 255 / .5), inset 0 -7px 0 rgb(120 80 0 / .22), 0 22px 40px rgb(0 0 0 / .32); }
  .tile sub { position: absolute; right: 12px; bottom: 12px; font: 700 20px Inter; }

  .pawn { left: -6px; top: 362px; width: 144px; height: 144px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #FFFFFF, #F3EEE2 60%, #E2DACA);
    box-shadow: inset 0 -6px 0 rgb(120 100 60 / .25), 0 20px 40px rgb(0 0 0 / .35); }
  .pawn::before, .pawn::after { content: ""; position: absolute; border-radius: 50%; }
  .pawn::before { inset: 18px; border: 3px solid rgb(140 120 80 / .22); box-shadow: inset 0 0 0 10px rgb(140 120 80 / .08); }
  .pawn::after { inset: 46px; border: 3px solid rgb(140 120 80 / .22); }

  .pawn.black { left: 40px; top: 300px;
    background: radial-gradient(circle at 38% 32%, #4A5157, #1E2327 62%, #14181B);
    box-shadow: inset 0 -6px 0 rgb(0 0 0 / .35), 0 20px 40px rgb(0 0 0 / .4); }
  .pawn.black::before { border-color: rgb(255 255 255 / .12); box-shadow: inset 0 0 0 10px rgb(0 0 0 / .14); }
  .pawn.black::after { border-color: rgb(255 255 255 / .12); }
  .pawn::before { inset: 16px; } .pawn::after { inset: 42px; }
  .die { left: 318px; top: 330px; width: 122px; height: 122px; border-radius: 26px; transform: rotate(12deg);
    background: linear-gradient(150deg, #E23A52, #B50F2A); padding: 18px;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center;
    box-shadow: inset 0 2px 0 rgb(255 255 255 / .25), inset 0 -6px 0 rgb(0 0 0 / .2), 0 22px 40px rgb(0 0 0 / .35); }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #FFFDF6; box-shadow: inset 0 2px 2px rgb(0 0 0 / .25); }
</style>
</head>
<body>

<div class="text">
  <h1>Des jeux simples pour nos <em>grands-parents</em></h1>
  <p>En grand et sans publicité</p>
</div>
<div class="brand"><img src="../public/icons/icon.svg" width="48" height="48" alt="">jeux-papi.fr</div>

<div class="games">
  <div class="card shadow"><div class="corner">A<svg viewBox="0 0 100 100"><path d="M50 92C22 66 5 50 5 31 5 17 16 7 29 7c9 0 17 5 21 14 4-9 12-14 21-14 13 0 24 10 24 24 0 19-17 35-45 61z"/></svg></div><svg viewBox="0 0 100 100"><path d="M50 92C22 66 5 50 5 31 5 17 16 7 29 7c9 0 17 5 21 14 4-9 12-14 21-14 13 0 24 10 24 24 0 19-17 35-45 61z"/></svg><div class="corner low">A<svg viewBox="0 0 100 100"><path d="M50 92C22 66 5 50 5 31 5 17 16 7 29 7c9 0 17 5 21 14 4-9 12-14 21-14 13 0 24 10 24 24 0 19-17 35-45 61z"/></svg></div></div>
  <div class="tile">A<sub>1</sub></div>
  <div class="pawn black"></div>
  <div class="pawn"></div>
  <div class="die"><span class="dot"></span><span></span><span class="dot"></span><span></span><span class="dot"></span><span></span><span class="dot"></span><span></span><span class="dot"></span></div>
</div>
</body>
</html>
